<?xml version="1.0" encoding="UTF-8"?>
<!--
  Elementor Kit Importer — icon master

  An arrow going down into a tray. Import, in the shape every operating system has used for it, which is worth more than anything cleverer.

  Palette — canonical copy lives in tests/assets/brand.ts. These values are
  repeated here only because SVG cannot import; if they ever disagree with that
  file, that file is right.

  Every stop is a Tailwind pink. Pink sits next to Elementor's own magenta without being it: near enough to belong in that ecosystem, far enough not to look official.

  Rendered to PNG by tests/assets/wporg-brand.spec.ts — never hand-edit the
  PNGs. See .wordpress-org/BRAND.md.

  Author: Al Amin Ahamed
  License: GPL-2.0-or-later
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="Elementor Kit Importer">
	<title>Elementor Kit Importer</title>

	<defs>
		<linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%"   stop-color="#500724"/>
			<stop offset="40%"  stop-color="#831843"/>
			<stop offset="78%"  stop-color="#db2777"/>
			<stop offset="100%" stop-color="#ec4899"/>
		</linearGradient>

		<radialGradient id="highlight" cx="22%" cy="18%" r="70%">
			<stop offset="0%"   stop-color="#f472b6" stop-opacity="0.30"/>
			<stop offset="55%"  stop-color="#db2777" stop-opacity="0.04"/>
			<stop offset="100%" stop-color="#500724" stop-opacity="0"/>
		</radialGradient>

		<linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%"   stop-color="#ffffff" stop-opacity="0.10"/>
			<stop offset="34%"  stop-color="#ffffff" stop-opacity="0"/>
		</linearGradient>

		<radialGradient id="pool" cx="78%" cy="104%" r="72%">
			<stop offset="0%"   stop-color="#db2777" stop-opacity="0.38"/>
			<stop offset="64%"  stop-color="#db2777" stop-opacity="0"/>
		</radialGradient>

		<linearGradient id="glyph" x1="50%" y1="0%" x2="50%" y2="100%">
			<stop offset="0%"   stop-color="#ffffff"/>
			<stop offset="60%"  stop-color="#fdf2f8"/>
			<stop offset="100%" stop-color="#fbcfe8"/>
		</linearGradient>
	</defs>

	<!-- Ground, highlight, refracted pool, specular sweep — the same stack
	     field() reproduces in CSS, so icon and banner catch the light alike. -->
	<rect width="256" height="256" rx="56" fill="url(#frame)"/>
	<rect width="256" height="256" rx="56" fill="url(#highlight)"/>
	<rect width="256" height="256" rx="56" fill="url(#pool)"/>
	<rect width="256" height="256" rx="56" fill="url(#specular)"/>

	<rect x="112" y="40" width="32" height="82" rx="10" fill="url(#glyph)"/>
	<path d="M88 108 L168 108 L128 166 Z" fill="url(#glyph)"/>
	<path d="M46 150 V190 a22 22 0 0 0 22 22 H188 a22 22 0 0 0 22-22 V150" fill="none" stroke="url(#glyph)" stroke-width="20" stroke-linecap="round"/>
</svg>
